<text x="56.640" y="182.060" textLength="484.524" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="9.00" font-weight="400" font-style="normal" fill="#000000">O programa organiza os dados da colônia Aurora Siger, estima a geração solar e eólica e compara essa </text>

<text x="56.640" y="256.940" textLength="208.712" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="9.00" font-weight="400" font-style="normal" fill="#000000">de emergência. As expressões principais são: </text>
<text x="64.944" y="279.050" textLength="129.977" lengthAdjust="spacingAndGlyphs" font-family="Consolas, monospace" font-size="8.04" font-weight="400" font-style="normal" fill="#000000">EMERGENCIA = C OR (D AND A)</text>
<text x="64.944" y="289.010" textLength="178.090" lengthAdjust="spacingAndGlyphs" font-family="Consolas, monospace" font-size="8.04" font-weight="400" font-style="normal" fill="#000000">ECONOMIA = NOT EMERGENCIA AND A AND B</text>
<text x="60.864" y="326.330" textLength="24.836" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="8.04" font-weight="700" font-style="normal" fill="#ffffff">Modo</text>
<text x="134.660" y="326.330" textLength="41.269" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="8.04" font-weight="700" font-style="normal" fill="#ffffff">Condição</text>
<text x="333.070" y="326.330" textLength="83.865" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="8.04" font-weight="700" font-style="normal" fill="#ffffff">O que o código faz</text>
<text x="134.660" y="342.410" textLength="189.420" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="8.04" font-weight="400" font-style="normal" fill="#000000">Reserva &lt; 20%, ou temperatura &lt; -80 °C com </text>
<text x="60.864" y="347.330" textLength="53.353" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="8.04" font-weight="400" font-style="normal" fill="#000000">EMERGENCIA</text>
<text x="333.070" y="347.330" textLength="183.971" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="8.04" font-weight="400" font-style="normal" fill="#000000">Desliga os equipamentos de prioridades 2 e 3</text>
<text x="134.660" y="352.250" textLength="59.818" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="8.04" font-weight="400" font-style="normal" fill="#000000">reserva &lt; 50%</text>
<text x="134.660" y="368.330" textLength="155.100" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="8.04" font-weight="400" font-style="normal" fill="#000000">Fora da emergência, reserva &lt; 50% e </text>
<text x="333.070" y="368.330" textLength="197.237" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="8.04" font-weight="400" font-style="normal" fill="#000000">Desliga somente os equipamentos de prioridade </text>
<text x="60.864" y="373.250" textLength="43.995" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="8.04" font-weight="400" font-style="normal" fill="#000000">ECONOMIA</text>

<text x="333.070" y="378.170" textLength="5.113" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="8.04" font-weight="400" font-style="normal" fill="#000000">3</text>

<text x="60.864" y="425.210" textLength="34.829" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="8.04" font-weight="400" font-style="normal" fill="#000000">NORMAL</text>

<text x="56.640" y="464.350" textLength="216.586" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="10.56" font-weight="700" font-style="normal" fill="#333333">3.1 Avisos que acompanham o modo</text>
<text x="56.640" y="481.030" textLength="202.995" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="9.00" font-weight="400" font-style="normal" fill="#000000">Sempre que A é verdadeira, aparece o alerta </text>
<text x="259.032" y="481.030" textLength="282.258" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="9.00" font-weight="400" font-style="normal" fill="#000000">para reduzir consumo. Esse aviso pode acompanhar economia </text>
<text x="56.640" y="493.630" textLength="484.488" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="9.00" font-weight="400" font-style="normal" fill="#000000">ou emergência. Também pode aparecer com modo NORMAL: por exemplo, reserva de 45% e consumo de </text>

<text x="56.640" y="549.070" textLength="330.412" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="9.00" font-weight="400" font-style="normal" fill="#000000">baterias. Esse aviso de clima pode aparecer junto com os outros modos. </text>
<text x="56.640" y="568.030" textLength="186.458" lengthAdjust="spacingAndGlyphs" font-family="Verdana, Arial, sans-serif" font-size="10.56" font-weight="700" font-style="normal" fill="#333333">3.2 Resultado do cenário inicial</text>
